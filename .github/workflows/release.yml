name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build DMG and IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      - name: Build universal Mac app
        env:
          ARCHS: arm64 x86_64
        run: ./src/build-app.sh

      - name: Build iPad IPA
        run: ./ios/build.sh

      - name: Package DMG
        env:
          ARCHS: arm64 x86_64
        run: ./package.sh

      - name: Verify artifacts
        run: |
          ls -lh dist/*.dmg ios/*.ipa
          unzip -l ios/*.ipa | tail -3

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "iPad 扩展屏 $tag" \
              --notes "自动构建产物。安装说明见仓库 README。"
          fi
          gh release upload "$tag" dist/*.dmg ios/*.ipa --clobber

      - name: Upload workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipad-extended-display
          path: |
            dist/*.dmg
            ios/*.ipa
          if-no-files-found: warn
